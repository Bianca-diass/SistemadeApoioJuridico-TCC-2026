<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Compromisso</title>

    <link rel="stylesheet" href="../../css/style.css">

    <link rel="stylesheet"
        href="../../css/style-advogado/cadastro-processo-adv.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="container">


    <main class="conteudo">


        <!-- ==========================================
             SETA DE VOLTAR
        =========================================== -->

        <a href="javascript:history.back()" class="btnVoltar">←</a>


        <!-- ==========================================
             TOPO
        =========================================== -->

        <header class="topoPagina">

            <h1>Cadastrar Compromisso</h1>

            <p>
                Cadastre um novo compromisso da agenda.
            </p>

        </header>


        <!-- ==========================================
             FORMULÁRIO
        =========================================== -->

        <form
            id="formCompromisso"
            class="cardFormulario"
        >


            <!-- TÍTULO -->

            <div class="grupo">

                <label for="titulo">
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Ex: Audiência Trabalhista"
                    required
                >

            </div>


            <!-- TIPO -->

            <div class="grupo">

                <label for="tipo">
                    Tipo
                </label>

                <select id="tipo" required>

                    <option value="">
                        Selecione o tipo
                    </option>

                    <option value="Audiência">
                        Audiência
                    </option>

                    <option value="Reunião">
                        Reunião
                    </option>

                    <option value="Prazo">
                        Prazo
                    </option>

                    <option value="Outro">
                        Outro
                    </option>

                </select>

            </div>


            <!-- DESCRIÇÃO -->

            <div class="grupo">

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    rows="4"
                    placeholder="Descrição do compromisso"
                ></textarea>

            </div>


            <!-- DATA -->

            <div class="grupo">

                <label for="data">
                    Data
                </label>

                <input
                    type="date"
                    id="data"
                    required
                >

            </div>


            <!-- DATA DO PRAZO -->

            <div class="grupo">

                <label for="dataPrazo">
                    Data do Prazo
                </label>

                <input
                    type="date"
                    id="dataPrazo"
                >

            </div>


            <!-- HORÁRIO LIMITE -->

            <div class="grupo">

                <label for="horaPrazo">
                    Horário Limite
                </label>

                <input
                    type="time"
                    id="horaPrazo"
                >

            </div>


            <!-- HORA -->

            <div class="grupo">

                <label for="hora">
                    Horário
                </label>

                <input
                    type="time"
                    id="hora"
                    required
                >

            </div>


            <!-- CLIENTE -->

            <div class="grupo">

                <label for="cliente">
                    Cliente
                </label>

                <input
                    type="text"
                    id="cliente"
                    placeholder="Nome do cliente"
                >

            </div>


            <!-- PROCESSO -->

            <div class="grupo">

                <label for="processo">
                    Processo
                </label>

                <input
                    type="text"
                    id="processo"
                    placeholder="Número do processo"
                >

            </div>


            <!-- LOCAL -->

            <div class="grupo">

                <label for="local">
                    Local
                </label>

                <input
                    type="text"
                    id="local"
                    placeholder="Local do compromisso"
                >

            </div>


            <!-- STATUS -->

            <div class="grupo">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="Agendado">
                        Agendado
                    </option>

                    <option value="Concluído">
                        Concluído
                    </option>

                    <option value="Cancelado">
                        Cancelado
                    </option>

                </select>

            </div>


            <!-- BOTÕES -->

            <div class="botoes">

                <button
                    type="submit"
                    class="salvar"
                >

                    <i class="fas fa-floppy-disk"></i>

                    Salvar Compromisso

                </button>


                <button
                    type="reset"
                    class="cancelar"
                >

                    Limpar

                </button>

            </div>


        </form>


    </main>


</div>


<script
    type="module"
    src="../../js/pages/advogado/cadastro-agenda.js">
</script>


</body>

</html>
