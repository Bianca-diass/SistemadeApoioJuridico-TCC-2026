
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Advogado - Sistema Jurídico</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/style-advogado/login-advogado.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="login-container">
    <div class="login-box">

        <div class="logo">
            <i class="fas fa-scale-balanced"></i>
            <h1>Criar Conta</h1>
            <p>Cadastre seu acesso ao Sistema Jurídico</p>
        </div>

        <form id="formCadastro">

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="campo">
                <label for="oab">OAB</label>
                <input type="text" id="oab" placeholder="Digite o número da OAB" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" minlength="6" required>
            </div>

            <div class="campo">
                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente" minlength="6" required>
            </div>

            <div id="msgErro" style="display:none; color:red; margin:10px 0;"></div>

            <button type="submit" id="btnCadastrar">
                <i class="fas fa-user-plus"></i>
                Cadastrar
            </button>

        </form>

        <div class="rodape">
            <p>Já possui uma conta?</p>

            <button type="button" id="btnVoltar">
                Voltar para Login
            </button>
        </div>

    </div>
</div>

<script type="module" src="../../js/pages/advogado/cadastro.js"></script>

</body>
</html>
