<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Documento</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/style-advogado/cadastro-documento-adv.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <main class="conteudo">

            <a href="javascript:history.back()" class="btnVoltar">←</a>

            <header class="topoPagina">

                <div>

                    <h1>Cadastrar Documento</h1>

                    <p>
                        Cadastre um documento e vincule-o a um cliente.
                    </p>

                </div>

            </header>


            <section class="formulario">

                <form id="formDocumento">


                    <!-- TÍTULO -->

                    <div class="campo">

                        <label for="titulo">
                            Título do documento
                        </label>

                        <input
                            type="text"
                            id="titulo"
                            name="titulo"
                            placeholder="Ex.: Contrato de prestação de serviços"
                            required>

                    </div>


                    <!-- TIPO -->

                    <div class="campo">

                        <label for="tipo">
                            Tipo do documento
                        </label>

                        <select
                            id="tipo"
                            name="tipo"
                            required>

                            <option value="">
                                Selecione o tipo
                            </option>

                            <option value="Contrato">
                                Contrato
                            </option>

                            <option value="Procuração">
                                Procuração
                            </option>

                            <option value="RG">
                                RG
                            </option>

                            <option value="CPF">
                                CPF
                            </option>

                            <option value="Comprovante">
                                Comprovante
                            </option>

                            <option value="Petição">
                                Petição
                            </option>

                            <option value="Outros">
                                Outros
                            </option>

                        </select>

                    </div>


                    <!-- CLIENTE -->

                    <div class="campo">

                        <label for="cliente">
                            Cliente
                        </label>

                        <select
                            id="cliente"
                            name="cliente"
                            required>

                            <option value="">
                                Carregando clientes...
                            </option>

                        </select>

                    </div>


                    <!-- PROCESSO -->

                    <div class="campo">

                        <label for="processo">
                            Processo
                        </label>

                        <input
                            type="text"
                            id="processo"
                            name="processo"
                            placeholder="Número do processo (opcional)">

                    </div>


                    <!-- DATA -->

                    <div class="campo">

                        <label for="dataEnvio">
                            Data de envio
                        </label>

                        <input
                            type="date"
                            id="dataEnvio"
                            name="dataEnvio"
                            required>

                    </div>


                    <!-- STATUS -->

                    <div class="campo">

                        <label for="status">
                            Status
                        </label>

                        <select
                            id="status"
                            name="status"
                            required>

                            <option value="">
                                Selecione o status
                            </option>

                            <option value="Pendente">
                                Pendente
                            </option>

                            <option value="Aprovado">
                                Aprovado
                            </option>

                            <option value="Rejeitado">
                                Rejeitado
                            </option>

                        </select>

                    </div>


                    <!-- DESCRIÇÃO -->

                    <div class="campo">

                        <label for="descricao">
                            Descrição
                        </label>

                        <textarea
                            id="descricao"
                            name="descricao"
                            rows="5"
                            placeholder="Digite uma descrição ou observação sobre o documento..."></textarea>

                    </div>


                    <!-- BOTÕES -->

                    <div class="botoes-formulario">



                        <button
                            type="submit"
                            class="botao-salvar">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Cadastrar documento

                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>


    <script
        type="module"
        src="../../js/pages/advogado/cadastro-documento.js">
    </script>

</body>

</html>
