
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos | Área do Advogado</title>
    <link rel="stylesheet" href="../../css/style-advogado/documentos-adv.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<main class="conteudo">
    <a href="dashboard-adv.html" class="btnVoltar">
        <i class="fas fa-arrow-left"></i>
    </a>

    <header class="topo">
        <h1>Documentos</h1>
        <p>Organize e gerencie os documentos dos seus clientes e processos.</p>
    </header>

    <section class="resumo">
        <div class="card">
            <i class="fas fa-file-pdf"></i>
            <div>
                <span>Total de documentos</span>
                <strong id="totalDocumentos">0</strong>
            </div>
        </div>

        <div class="card">
            <i class="fas fa-folder-open"></i>
            <div>
                <span>Documentos encontrados</span>
                <strong id="totalFiltrados">0</strong>
            </div>
        </div>
    </section>

    <section class="painel">
        <h2><i class="fas fa-cloud-arrow-up"></i> Enviar documento</h2>

        <form id="formDocumento">
            <div class="campo">
                <label for="nomeDocumento">Nome do documento</label>
                <input type="text" id="nomeDocumento" required placeholder="Ex.: Contrato de prestação de serviços">
            </div>

            <div class="campo">
                <label for="categoria">Categoria</label>
                <select id="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="Petição">Petição</option>
                    <option value="Contrato">Contrato</option>
                    <option value="Procuração">Procuração</option>
                    <option value="Comprovante">Comprovante</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div class="campo">
                <label for="cliente">Nome do cliente</label>
                <input type="text" id="cliente" required placeholder="Nome do cliente">
            </div>

            <div class="campo">
                <label for="processo">Número do processo</label>
                <input type="text" id="processo" placeholder="Número do processo">
            </div>

            <div class="campo">
                <label for="arquivo">Arquivo PDF</label>
                <input type="file" id="arquivo" accept=".pdf,application/pdf" required>
                <small>Somente arquivos PDF de até 10 MB.</small>
            </div>

            <button type="submit">
                <i class="fas fa-upload"></i> Adicionar documento
            </button>
            <p id="mensagem"></p>
        </form>
    </section>

    <section class="painel">
        <h2><i class="fas fa-folder"></i> Meus documentos</h2>

        <div class="filtros">
            <input type="search" id="pesquisa" placeholder="Pesquisar documento, cliente ou processo...">

            <select id="filtroCategoria">
                <option value="">Todas as categorias</option>
                <option value="Petição">Petição</option>
                <option value="Contrato">Contrato</option>
                <option value="Procuração">Procuração</option>
                <option value="Comprovante">Comprovante</option>
                <option value="Outros">Outros</option>
            </select>
        </div>

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Documento</th>
                        <th>Categoria</th>
                        <th>Cliente</th>
                        <th>Processo</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaDocumentos">
                    <tr>
                        <td colspan="6" class="vazio">Nenhum documento cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="../../js/pages/advogado/documentos-adv.js"></script>
</body>
</html>
