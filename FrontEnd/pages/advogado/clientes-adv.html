
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes do Advogado</title>

    <link rel="stylesheet" href="../../css/style-advogado/clientes-adv.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">
    <main class="pagina-clientes">

        <!-- Cabeçalho -->
        <header class="cabecalho-clientes">
            <div class="titulo-pagina">
                <a href="dashboard-adv.html" class="btnVoltar" title="Voltar ao painel">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <h1>Clientes</h1>
                <p>Gerencie todos os clientes cadastrados.</p>
            </div>

            <a href="cadastro-cliente-adv.html" class="botao-novo">
                <i class="fa-solid fa-user-plus"></i>
                Novo Cliente
            </a>
        </header>

        <!-- Indicadores -->
        <section class="cards-clientes">

            <article class="card-cliente">
                <div class="icone-card azul">
                    <i class="fa-solid fa-users"></i>
                </div>

                <div>
                    <span>Total de clientes</span>
                    <h2 id="totalClientes">0</h2>
                </div>
            </article>

            <article class="card-cliente">
                <div class="icone-card vermelho">
                    <i class="fa-solid fa-location-dot"></i>
                </div>

                <div>
                    <span>Cidades atendidas</span>
                    <h2 id="totalCidades">0</h2>
                </div>
            </article>

            <article class="card-cliente">
                <div class="icone-card verde">
                    <i class="fa-solid fa-user-check"></i>
                </div>

                <div>
                    <span>Clientes ativos</span>
                    <h2 id="clientesAtivos">0</h2>
                </div>
            </article>

        </section>

        <!-- Pesquisa e filtros -->
        <section class="filtros-clientes">

            <div class="campo-busca">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="search"
                    id="buscarCliente"
                    placeholder="Buscar por nome, telefone ou cidade..."
                    aria-label="Buscar clientes"
                >
            </div>

            <select id="filtroStatus" aria-label="Filtrar clientes por status">
                <option value="">Todos os clientes</option>
                <option value="ativo">Ativos</option>
                <option value="inativo">Inativos</option>
            </select>

        </section>

        <!-- Tabela -->
        <section class="tabela-clientes">

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Email</th>
                        <th>Endereço</th>
                        <th>Cidade/UF</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaClientes">
                    <tr>
                        <td colspan="7" class="mensagem-vazia">
                            Carregando clientes...
                        </td>
                    </tr>
                </tbody>
            </table>

        </section>

    </main>
</div>

<script type="module" src="../../js/pages/advogado/clientes.js"></script>

</body>
</html>
