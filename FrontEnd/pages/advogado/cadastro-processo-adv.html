<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Processo</title>

    <link rel="stylesheet" href="../../css/style.css">

    <link rel="stylesheet"
        href="../../css/style-advogado/cadastro-processo-adv.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <main class="conteudo">

        <!-- SETA DE VOLTAR -->

        <a href="processos-adv.html"
           class="btnVoltar"
           title="Voltar">
        </a>


        <!-- CABEÇALHO -->

        <header class="topoPagina">

            <h1>Cadastrar Processo</h1>

            <p>
                Cadastre um novo processo jurídico.
            </p>

        </header>


        <!-- FORMULÁRIO -->

        <form id="formProcesso"
              class="cardFormulario">


            <!-- NÚMERO DO PROCESSO -->

            <div class="grupo">

                <label for="numero">
                    Número do Processo
                </label>

                <input
                    type="text"
                    id="numero"
                    placeholder="0000000-00.0000.0.00.0000"
                    required>

            </div>


            <!-- CLIENTE -->

            <div class="grupo">

                <label for="cliente">
                    Cliente
                </label>

                <input
                    type="text"
                    id="cliente"
                    placeholder="Nome do cliente"
                    required>

            </div>


            <!-- VARA -->

            <div class="grupo">

                <label for="vara">
                    Vara
                </label>

                <input
                    type="text"
                    id="vara"
                    placeholder="Ex: Vara Cível">

            </div>


            <!-- TRIBUNAL -->

            <div class="grupo">

                <label for="tribunal">
                    Tribunal
                </label>

                <input
                    type="text"
                    id="tribunal"
                    placeholder="Ex: TJMS">

            </div>


            <!-- MANIFESTAÇÃO -->

            <div class="grupo">

                <label for="tipoManifestacao">
                    Manifestação
                </label>

                <select id="tipoManifestacao">

                    <option value="">
                        Selecione uma manifestação
                    </option>

                    <option value="Contestação">
                        Contestação
                    </option>

                    <option value="Impugnação à contestação">
                        Impugnação à contestação
                    </option>

                    <option value="Réplica">
                        Réplica
                    </option>

                    <option value="Tréplica">
                        Tréplica
                    </option>

                    <option value="Petição">
                        Petição
                    </option>

                    <option value="Manifestação">
                        Manifestação
                    </option>

                </select>

            </div>


            <!-- ÚLTIMA MOVIMENTAÇÃO -->

            <div class="grupo">

                <label for="ultimaMovimentacao">
                    Última movimentação
                </label>

                <input
                    type="text"
                    id="ultimaMovimentacao"
                    placeholder="Ex: Contestação protocolada">

            </div>


            <!-- INTIMAÇÃO -->

            <div class="grupo">

                <label for="intimacao">
                    Intimação
                </label>

                <select id="intimacao">

                    <option value="false">
                        Sem intimação
                    </option>

                    <option value="true">
                        Nova intimação
                    </option>

                </select>

            </div>


            <!-- STATUS -->

            <div class="grupo">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="Em andamento">
                        Em andamento
                    </option>

                    <option value="Aguardando audiência">
                        Aguardando audiência
                    </option>

                    <option value="Em recurso">
                        Em recurso
                    </option>

                    <option value="Concluído">
                        Concluído
                    </option>

                    <option value="Arquivado">
                        Arquivado
                    </option>

                </select>

            </div>


            <!-- PRAZO -->

            <div class="grupo">

                <label for="prazo">
                    Prazo
                </label>

                <input
                    type="date"
                    id="prazo">

            </div>


            <!-- DESCRIÇÃO -->

            <div class="grupo">

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    rows="5"
                    placeholder="Descrição do processo..."></textarea>

            </div>


            <!-- BOTÕES -->

            <div class="botoes">

                <button
                    type="submit"
                    class="salvar">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Salvar Processo

                </button>


                <button
                    type="reset"
                    class="cancelar">

                    Limpar

                </button>

            </div>

        </form>

    </main>

</div>


<!-- JAVASCRIPT -->

<script
    type="module"
    src="../../js/services/cadastro-processo.js">
</script>

</body>

</html>
