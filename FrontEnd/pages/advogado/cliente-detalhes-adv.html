<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cliente - Detalhes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../../css/style-advogado/cliente-detalhes.css">
</head>

<body>

    <main class="conteudo">

        <!-- CABEÇALHO -->

        <header class="cabecalhoCliente">

            <h1 id="tituloCliente">Cliente</h1>

            <p>Visualize os dados cadastrais do cliente.</p>

        </header>


        <!-- INFORMAÇÕES (preenchidas pelo JavaScript) -->

        <section class="cardInformacoes" id="areaCliente">

            <div class="carregando">

                <i class="fas fa-spinner fa-spin"></i>

                <span>Carregando dados do cliente...</span>

            </div>

        </section>


        <!-- BOTÕES -->

        <div class="botoesCliente">

            <a href="javascript:history.back()" class="botaoVoltar">

                <i class="fas fa-arrow-left"></i>

                Voltar

            </a>

            <a href="#" class="botaoEditar" id="botaoEditar">

                <i class="fas fa-pen"></i>

                Editar cliente

            </a>

        </div>

    </main>

    <script
        type="module"
        src="../../js/pages/advogado/cliente-detalhes-adv.js">
    </script>

</body>

</html>
