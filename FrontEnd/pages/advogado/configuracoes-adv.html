<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações | Área do Advogado</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style-advogado/configuracao-adv.css">
</head>
<body>

  <aside>
    <div class="brand">Área do Advogado</div>

    <nav>
      <a href="dashboard-adv.html">Dashboard</a>
      <a href="clientes-adv.html">Clientes</a>
      <a href="processos-adv.html">Processos</a>
      <a href="documentos-adv.html">Documentos</a>
      <a href="agenda-adv.html">Agenda</a>
      <a href="relatorios-adv.html">Relatórios</a>
      <a href="configuracoes-adv.html" class="on">Configurações</a>
    </nav>

    <div class="user">
      <div class="av" id="inicialUsuario">A</div>
      <div>
        <span id="nomeUsuario">Advogado</span>
        <small><a href="login.html" id="btnSair">Sair</a></small>
      </div>
    </div>
  </aside>

  <main>
    <header>
      <h1>Configurações</h1>
      <p class="sub">Atualize seus dados e preferências.</p>
    </header>

    <section class="card">

      <!-- PERFIL -->
      <form id="formPerfil" novalidate>
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" maxlength="120" required>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(67) 99999-9999" maxlength="15" inputmode="numeric">
        </div>

        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" autocomplete="off">
        </div>

        <div class="campo">
          <label for="oab">OAB</label>
          <input type="text" id="oab" name="oab" placeholder="Ex.: 29588/MS" maxlength="9" autocomplete="off">
        </div>

        <button type="submit" class="btn" id="btnSalvarPerfil">Salvar alterações</button>

        <p id="mensagemPerfil" class="mensagem"></p>
      </form>

      <!-- SEGURANÇA -->
      <div class="secao-senha">
        <h2>Segurança</h2>
        <p>Para trocar o e-mail ou a senha, informe sua senha atual.</p>

        <form id="formSenha" novalidate>
          <div class="campo">
            <label for="senhaAtual">Senha atual</label>
            <input type="password" id="senhaAtual" name="senhaAtual" autocomplete="current-password">
          </div>

          <div class="campo">
            <label for="novaSenha">Nova senha (opcional)</label>
            <input type="password" id="novaSenha" name="novaSenha"
              placeholder="Digite sua nova senha" minlength="6" autocomplete="new-password">
          </div>

          <div class="campo">
            <label for="confirmarSenha">Confirmar nova senha</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha"
              placeholder="Confirme sua nova senha" minlength="6" autocomplete="new-password">
          </div>

          <button type="submit" class="btn" id="btnAlterarSenha">Alterar senha</button>

          <p id="mensagemSenha" class="mensagem"></p>
        </form>
      </div>

      <!-- ENCERRAR SESSÃO -->
      <div class="sair secao-senha">
        <button type="button" class="btn logout" id="btnLogout">Sair do sistema</button>
      </div>

    </section>
  </main>

  <script type="module" src="../../js/pages/advogado/configuracoes-adv.js"></script>
</body>
</html>
