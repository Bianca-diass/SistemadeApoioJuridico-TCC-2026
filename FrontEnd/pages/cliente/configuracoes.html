```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações - Área do Cliente</title>

  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style-cliente/cliente.css">
</head>
<body>

  <aside>
    <div class="brand">Área do Cliente</div>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="agenda.html">Agenda</a>
      <a href="documentos.html">Documentos</a>
      <a href="configuracoes.html" class="on">Configurações</a>
    </nav>

    <div class="user">
      <div class="av">C</div>
      <div>
        Cliente
        <small><a href="login.html">Sair</a></small>
      </div>
    </div>
  </aside>

  <main>
    <header>
      <h1>Configurações</h1>
      <p class="sub">Atualize seus dados e preferências.</p>
    </header>

    <section class="card">
      <form id="form-config">
        <label>
          Nome completo
          <input type="text" name="nome" value="Cliente" required>
        </label>

        <label>
          E-mail
          <input type="email" name="email" placeholder="seu@email.com" required>
        </label>

        <label>
          Telefone
          <input type="tel" name="telefone" placeholder="(67) 90000-0000">
        </label>

        <button class="btn" type="submit" id="btn-salvar">
          Salvar alterações
        </button>

        <span class="badge b-ok" id="msg" hidden></span>
      </form>
    </section>
  </main>

  <script>
    const CHAVE = 'config-cliente';

    const form = document.getElementById('form-config');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn-salvar');

    function avisar(texto, tipo = 'sucesso') {
      msg.textContent = texto;
      msg.className = 'badge ' + (tipo === 'erro' ? 'b-warn' : 'b-ok');
      msg.hidden = false;

      setTimeout(() => {
        msg.hidden = true;
      }, 3500);
    }

    // Carrega os dados salvos neste navegador.
    try {
      const salvo = JSON.parse(localStorage.getItem(CHAVE) || '{}');

      for (const [campo, valor] of Object.entries(salvo)) {
        if (form.elements[campo]) {
          form.elements[campo].value = valor;
        }
      }
    } catch (erro) {
      console.error('Erro ao carregar configurações:', erro);
    }

    // Salva as alterações.
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const dados = Object.fromEntries(new FormData(form));

      btn.disabled = true;

      try {
        localStorage.setItem(CHAVE, JSON.stringify(dados));
        avisar('Alterações salvas com sucesso!');
      } catch (erro) {
        avisar('Não foi possível salvar as alterações.', 'erro');
      } finally {
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
