<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações - Área do Cliente</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style-cliente/configuracao-cliente.css">

  <style>
    .secao-senha { margin: 10px 0 0; padding-top: 18px; border-top: 1px solid rgba(15, 31, 51, .12); }
    .secao-senha h2 { margin: 0 0 4px; font-size: 1rem; }
    .secao-senha p { margin: 0 0 12px; font-size: .85rem; opacity: .7; }
    #msg { white-space: normal; }
  </style>
</head>
<body>

  <aside>
    <div class="brand">Área do Cliente</div>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="agenda.html">Agenda</a>
      <a href="documentos.html">Documentos</a>
      <a href="configuracoes.html" class="on">Configurações</a>
    </nav>

    <div class="user">
      <div class="av" id="inicialUsuario">C</div>
      <div>
        <span id="nomeUsuario">Cliente</span>
        <small><a href="login.html" id="btnSair">Sair</a></small>
      </div>
    </div>
  </aside>

  <main>
    <header>
      <h1>Configurações</h1>
      <p class="sub">Atualize seus dados e preferências.</p>
    </header>

    <section class="card">
      <form id="form-config" novalidate>
        <label>
          Nome completo
          <input type="text" name="nome" maxlength="120" required>
        </label>

        <label>
          E-mail
          <input type="email" name="email" placeholder="seu@email.com" required>
        </label>

        <label>
          Telefone
          <input type="tel" name="telefone" placeholder="(67) 90000-0000" maxlength="15">
        </label>

        <div class="secao-senha">
          <h2>Segurança</h2>
          <p>Para trocar o e-mail ou a senha, informe sua senha atual.</p>

          <label>
            Senha atual
            <input type="password" name="senhaAtual" autocomplete="current-password">
          </label>

          <label>
            Nova senha (opcional)
            <input type="password" name="novaSenha" autocomplete="new-password"
              placeholder="Mínimo 8 caracteres, com letras e números">
          </label>

          <label>
            Confirmar nova senha
            <input type="password" name="confirmarSenha" autocomplete="new-password">
          </label>
        </div>

        <button class="btn" type="submit" id="btn-salvar">
          Salvar alterações
        </button>

        <span class="badge b-ok" id="msg" role="status" hidden></span>
      </form>
    </section>
  </main>

  <script>
    (function () {
      var API = 'http://localhost:3000/cliente';

      var token = localStorage.getItem('token');
      if (!token) { window.location.href = 'login.html'; return; }

      var form = document.getElementById('form-config');
      var msg = document.getElementById('msg');
      var btn = document.getElementById('btn-salvar');
      var temporizador = null;

      /* ----- aviso ----- */
      function avisar(texto, tipo) {
        msg.textContent = texto;
        msg.className = 'badge ' + (tipo === 'erro' ? 'b-warn' : 'b-ok');
        msg.hidden = false;

        clearTimeout(temporizador);
        temporizador = setTimeout(function () { msg.hidden = true; }, 5000);
      }

      /* ----- requisição ----- */
      function chamar(url, opcoes) {
        opcoes = opcoes || {};
        opcoes.headers = Object.assign({
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token
        }, opcoes.headers || {});

        return fetch(url, opcoes).then(function (resp) {
          return resp.json().catch(function () { return {}; }).then(function (dados) {
            // 401 com mensagem de senha = senha atual errada (não é sessão vencida)
            var senhaErrada = resp.status === 401 && /senha/i.test(dados.erro || '');

            if (resp.status === 401 && !senhaErrada) {
              sair();
              throw new Error('Sua sessão expirou. Faça login novamente.');
            }

            if (!resp.ok) {
              throw new Error(dados.erro || 'Erro ao processar a solicitação.');
            }

            return dados;
          });
        });
      }

      function sair() {
        ['token', 'refreshToken', 'tokenExpiraEm', 'usuario'].forEach(function (k) {
          localStorage.removeItem(k);
        });
        window.location.href = 'login.html';
      }

      document.getElementById('btnSair').addEventListener('click', function (e) {
        e.preventDefault();
        sair();
      });

      /* ----- máscara de telefone ----- */
      var campoTelefone = form.elements.telefone;

      function mascara(valor) {
        var n = valor.replace(/\D/g, '').slice(0, 11);
        if (n.length > 10) return '(' + n.slice(0, 2) + ') ' + n.slice(2, 7) + '-' + n.slice(7);
        if (n.length > 6) return '(' + n.slice(0, 2) + ') ' + n.slice(2, 6) + '-' + n.slice(6);
        if (n.length > 2) return '(' + n.slice(0, 2) + ') ' + n.slice(2);
        return n;
      }

      campoTelefone.addEventListener('input', function () {
        campoTelefone.value = mascara(campoTelefone.value);
      });

      /* ----- carrega os dados do banco ----- */
      var emailOriginal = '';

      function preencherUsuarioLateral(nome) {
        var nomeEl = document.getElementById('nomeUsuario');
        var inicialEl = document.getElementById('inicialUsuario');
        var primeiro = (nome || 'Cliente').trim().split(/\s+/)[0];

        nomeEl.textContent = primeiro;
        inicialEl.textContent = primeiro.charAt(0).toUpperCase();
      }

      chamar(API + '/perfil').then(function (perfil) {
        form.elements.nome.value = perfil.nome || '';
        form.elements.email.value = perfil.email || '';
        form.elements.telefone.value = mascara(perfil.telefone || '');
        emailOriginal = (perfil.email || '').toLowerCase();
        preencherUsuarioLateral(perfil.nome);
      }).catch(function (erro) {
        console.error(erro);
        avisar(erro.message, 'erro');
      });

      /* ----- salvar ----- */
      form.addEventListener('submit', function (e) {
        e.preventDefault();

        var nome = form.elements.nome.value.trim();
        var email = form.elements.email.value.trim();
        var telefone = form.elements.telefone.value.trim();
        var senhaAtual = form.elements.senhaAtual.value;
        var novaSenha = form.elements.novaSenha.value;
        var confirmar = form.elements.confirmarSenha.value;

        if (!nome) return avisar('Informe o seu nome.', 'erro');
        if (!/^\S+@\S+\.\S+$/.test(email)) return avisar('Informe um e-mail válido.', 'erro');

        if (novaSenha) {
          if (novaSenha.length < 8 || !/[A-Za-z]/.test(novaSenha) || !/\d/.test(novaSenha)) {
            return avisar('A nova senha deve ter no mínimo 8 caracteres, com letras e números.', 'erro');
          }
          if (novaSenha !== confirmar) return avisar('A confirmação da senha não confere.', 'erro');
        }

        var mudouEmail = email.toLowerCase() !== emailOriginal;

        if ((mudouEmail || novaSenha) && !senhaAtual) {
          return avisar('Informe a senha atual para trocar o e-mail ou a senha.', 'erro');
        }

        var corpo = { nome: nome, email: email, telefone: telefone };
        if (novaSenha) corpo.novaSenha = novaSenha;
        if (senhaAtual) corpo.senhaAtual = senhaAtual;

        btn.disabled = true;

        chamar(API + '/configuracoes', {
          method: 'PUT',
          body: JSON.stringify(corpo)
        }).then(function (resp) {
          emailOriginal = email.toLowerCase();
          preencherUsuarioLateral(nome);

          form.elements.senhaAtual.value = '';
          form.elements.novaSenha.value = '';
          form.elements.confirmarSenha.value = '';

          avisar(resp.senhaAlterada
            ? 'Alterações salvas e senha atualizada!'
            : 'Alterações salvas com sucesso!');
        }).catch(function (erro) {
          avisar(erro.message, 'erro');
        }).then(function () {
          btn.disabled = false;
        });
      });
    })();
  </script>

</body>
</html>
