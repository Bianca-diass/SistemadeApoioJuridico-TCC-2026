<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações | Área do Cliente</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style-cliente/configuracao-cliente.css">
</head>
<body>

  <aside>
    <div class="brand">Área do Cliente</div>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="agenda.html">Agenda</a>
      <a href="documentos.html">Documentos</a>
      <a href="configuracoes.html" class="on">Configurações</a>
    </nav>

    <div class="user">
      <div class="av" id="inicialUsuario">C</div>
      <div>
        <span id="nomeUsuario">Cliente</span>
        <small><a href="login.html" id="btnSair">Sair</a></small>
      </div>
    </div>
  </aside>

  <main>
    <header>
      <h1>Configurações</h1>
      <p class="sub">Atualize seus dados e preferências.</p>
    </header>

    <section class="card">
      <form id="form-config" novalidate>
        <label>
          Nome completo
          <input type="text" name="nome" maxlength="120" required>
        </label>

        <label>
          E-mail
          <input type="email" name="email" placeholder="seu@email.com" required>
        </label>

        <label>
          Telefone
          <input type="tel" name="telefone" placeholder="(67) 90000-0000" maxlength="15">
        </label>

        <div class="secao-senha">
          <h2>Segurança</h2>
          <p>Para trocar o e-mail ou a senha, informe sua senha atual.</p>

          <label>
            Senha atual
            <input type="password" name="senhaAtual" autocomplete="current-password">
          </label>

          <label>
            Nova senha (opcional)
            <input type="password" name="novaSenha" autocomplete="new-password"
              placeholder="Mínimo 8 caracteres, com letras e números">
          </label>

          <label>
            Confirmar nova senha
            <input type="password" name="confirmarSenha" autocomplete="new-password">
          </label>
        </div>

        <button class="btn" type="submit" id="btn-salvar">
          Salvar alterações
        </button>

        <span class="badge b-ok" id="msg" role="status" hidden></span>
      </form>
    </section>
  </main>
