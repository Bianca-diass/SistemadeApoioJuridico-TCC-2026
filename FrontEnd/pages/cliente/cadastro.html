<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Área do Cliente</title>

    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style-cliente/cadastro-cliente.css">
</head>

<body>
    <main class="paginaCadastro">
        <header class="topoPagina">
            <div>
                <h1>Criar cadastro</h1>
                <p>Crie sua conta para acessar sua área jurídica.</p>
            </div>
        </header>

        <section class="formCadastro">
            <h2>Dados pessoais</h2>

            <form id="formCadastro" novalidate>
                <div class="grupo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="grupo">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        inputmode="numeric"
                        maxlength="14"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="grupo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="duasColunas">
                    <div class="grupo">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Mínimo de 6 caracteres"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="grupo">
                        <label for="confirmarSenha">Confirmar senha</label>
                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Digite a senha novamente"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                </div>

                <p id="mensagem" role="status" aria-live="polite"></p>

                <div class="acoesFormulario">
                    <button class="btnSalvar" id="btnCadastrar" type="submit">
                        Criar cadastro
                    </button>

                    <button class="btnCancelar" type="button"
                        onclick="window.location.href='login.html'">
                        Voltar ao login
                    </button>
                </div>
            </form>

            <p class="textoLogin">
                Já tem conta?
                <a href="login.html">Entrar</a>
            </p>
        </section>
    </main>

    <script type="module" src="../../js/cliente/cadastro-cliente.js"></script>
</body>
</html>
