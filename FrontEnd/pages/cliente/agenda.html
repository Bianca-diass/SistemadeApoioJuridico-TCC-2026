<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda | Área do Cliente</title>

  <link rel="stylesheet" href="../../css/style-cliente/agenda-cliente.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-top">
        <h1 class="sidebar-title">Área do Cliente</h1>
        <div class="sidebar-line"></div>

        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-link">
            <span>Dashboard</span>
          </a>
          <a href="agenda.html" class="nav-link active">
            <span>Agenda</span>
          </a>
          <a href="documentos.html" class="nav-link">
            <span>Documentos</span>
          </a>
          <a href="configuracoes.html" class="nav-link">
            <span>Configurações</span>
          </a>
        </nav>
      </div>
    </aside>

    <main class="content">

      <header class="page-header">
        <h2>Agenda</h2>
        <p id="resumo-agenda">Carregando...</p>
      </header>

      <section class="stats">
        <div class="stat-card destaque">
          <div class="stat-icon"><i data-lucide="clock"></i></div>
          <div class="stat-texto">
            <small>PRÓXIMO COMPROMISSO</small>
            <strong id="stat-proximo">—</strong>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon"><i data-lucide="calendar-check"></i></div>
          <div class="stat-texto">
            <small>NESTE MÊS</small>
            <strong id="stat-mes">0</strong>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon"><i data-lucide="calendar"></i></div>
          <div class="stat-texto">
            <small>TOTAL DE COMPROMISSOS</small>
            <strong id="stat-total">0</strong>
          </div>
        </div>
      </section>

      <section class="card card-agenda">
        <div class="card-header">
          <h3 class="card-title">Meus compromissos</h3>

          <div class="tabs">
            <button class="tab active" data-filtro="proximos">Próximos</button>
            <button class="tab" data-filtro="anteriores">Anteriores</button>
            <button class="tab" data-filtro="todos">Todos</button>
          </div>
        </div>

        <div class="busca-box">
          <i data-lucide="search"></i>
          <input type="text" id="busca" placeholder="Buscar compromisso...">
        </div>

        <div id="lista-agenda" class="lista-agenda"></div>
      </section>

    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>

  <script type="module" src="../../js/pages/cliente/agenda.js"></script>

</body>
</html>
