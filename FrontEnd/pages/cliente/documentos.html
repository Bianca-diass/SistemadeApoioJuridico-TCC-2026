<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<body class="documentos-page">
<aside>
  <div class="brand">Área do Cliente</div>

      <p>Formatos aceitos: PDF, JPG e PNG, até 10 MB.</p>
      <label class="btn" for="arquivo">Enviar documento</label>
      <input type="file" id="arquivo" accept=".pdf,.jpg,.jpeg,.png">

  </section>

  <section class="card">
    <div class="head"><h2>Meus documentos</h2></div>
    <div id="docs"></div>
